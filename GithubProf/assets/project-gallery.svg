<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="1200" height="940" role="img" aria-labelledby="title desc">
  <title id="title">Projects by Ashish Raunak</title><desc id="desc">Eight academic and personal projects across student productivity, online assessment, social impact, academic records, campus services, Flask, and Laravel.</desc>
