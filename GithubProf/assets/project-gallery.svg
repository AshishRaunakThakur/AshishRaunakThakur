  <g font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="1.8" fill="#C77B9B"><text x="58" y="143">01 · STUDENT PRODUCTIVITY</text><text x="633" y="143">02 · ONLINE ASSESSMENT</text><text x="58" y="341">03 · SOCIAL IMPACT</text><text x="633" y="341">04 · ACADEMIC RECORDS</text><text x="58" y="539">05 · CAMPUS SERVICE</text><text x="633" y="539">06 · CAMPUS EVENTS</text><text x="58" y="737">07 · WEB APPLICATION</text><text x="633" y="737">08 · CAMPUS MANAGEMENT</text></g>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#F8F0F3" font-size="21" font-weight="700"><text x="58" y="178">Study Planner</text><text x="633" y="178">ExamVision</text><text x="58" y="376">Asmeera Lifeline</text><text x="633" y="376">Academic Record System</text><text x="58" y="574">MU Lost &amp; Found</text><text x="633" y="574">MU Event Hub</text><text x="58" y="772">Ashmeera Empoweres</text><text x="633" y="772">Campus Cleaning</text></g>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#B6A3AC" font-size="14"><text x="58" y="209"><tspan x="58">Organizes subjects, study schedules, and daily</tspan><tspan x="58" dy="20">learning activities for students.</tspan></text><text x="633" y="209"><tspan x="633">MCQ practice and online assessments to help</tspan><tspan x="633" dy="20">students test what they've learned.</tspan></text><text x="58" y="407"><tspan x="58">Connects people seeking help with volunteers</tspan><tspan x="58" dy="20">and NGOs through roles and assistance requests.</tspan></text><text x="633" y="407"><tspan x="633">Manages student academic information using</tspan><tspan x="633" dy="20">web technologies and file handling.</tspan></text><text x="58" y="605"><tspan x="58">A campus project for reporting and finding</tspan><tspan x="58" dy="20">lost belongings.</tspan></text><text x="633" y="605"><tspan x="633">A university event platform for sharing and</tspan><tspan x="633" dy="20">managing event information.</tspan></text><text x="58" y="803"><tspan x="58">A Flask web app built as a hands-on Python</tspan><tspan x="58" dy="20">web development project.</tspan></text><text x="633" y="803"><tspan x="633">Campus cleaning management with Laravel</tspan><tspan x="633" dy="20">and database functionality.</tspan></text></g>
