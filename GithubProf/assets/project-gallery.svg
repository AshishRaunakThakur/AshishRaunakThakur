  <text x="42" y="53" fill="#C77B9B" font-family="ui-monospace,Consolas,monospace" font-size="13" letter-spacing="2.7">PROJECT ARCHIVE · 8 BUILDS</text><text x="42" y="84" fill="#F8F0F3" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600">Academic and personal projects I've worked on.</text>
